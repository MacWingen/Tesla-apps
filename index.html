<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Launcher</title>
    <style>
        :root {
            --bg-color: #121214;
            --text-color: #f1f1f1;
            --title-color: #d1d5db;
            --tile-bg: #1b1b1e;
            --tile-border: rgba(255, 255, 255, 0.06);
            --name-color: #9e9ea6;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f3f4f6;
                --text-color: #1f2937;
                --title-color: #374151;
                --tile-bg: #ffffff;
                --tile-border: rgba(0, 0, 0, 0.08);
                --name-color: #4b5563;
            }
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 35px 25px 25px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            max-width: 680px;
            width: 100%;
            justify-items: center;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .app-item:active {
            transform: scale(0.92); 
        }

        .app-icon {
            width: 105px;
            height: 105px;
            border-radius: 26px;
            overflow: hidden;
            margin-bottom: 10px;
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--tile-border);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-icon span.placeholder {
            font-size: 38px;
            font-weight: 600;
            color: var(--text-color);
        }

        .app-name {
            font-size: 14px;
            font-weight: 400;
            text-align: center;
            color: var(--name-color);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>

        apps.forEach(app => {

                : `<span class="placeholder">${app.name[0]}</span>`;

            grid.innerHTML += `
                <sp>

                </a>

        });
