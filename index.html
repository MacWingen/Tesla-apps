<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Apps Dashboard</title>
    <!-- Favicon für Browser-Tabs und Lesezeichen -->
    <link rel="icon" type="image/png" href="icons/hedgehog.png">
    
    <style>
        :root {
            --bg-color: #121214;
            --text-color: #f1f1f1;
            --title-color: #d1d5db;
            --tile-bg: #1b1b1e;
            --tile-border: rgba(255, 255, 255, 0.08);
            --name-color: #9e9ea6;
            --section-color: #9ca3af;
            --hover-bg: #2a2a2e;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f3f4f6;
                --text-color: #1f2937;
                --title-color: #374151;
                --tile-bg: #ffffff;
                --tile-border: rgba(0, 0, 0, 0.08);
                --name-color: #4b5563;
                --section-color: #4b5563;
                --hover-bg: #e5e7eb;
            }
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px 25px 25px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Bar */
        .top-bar {
            max-width: 680px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: none;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
            padding-top: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .top-bar::-webkit-scrollbar {
            display: none;
        }

        /* 1. Logo (Igel frei) */
        .brand-logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Feiner Trennstrich */
        .bar-divider {
            width: 1px;
            height: 16px;
            background-color: var(--tile-border);
            flex-shrink: 0;
        }

        /* In-Bar Control Buttons */
        .bar-icon-btn {
            background: transparent;
            border: none;
            color: var(--section-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .bar-icon-btn:hover, .bar-icon-btn.active {
            color: var(--text-color);
            background-color: var(--hover-bg);
        }

        /* Unsichtbares Suchfeld für Tesla-Tastatur */
        #searchInput {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
        }

        /* Kategorie Reiter */
        .tabs-container {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--section-color);
            font-size: 14px;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            color: var(--text-color);
            background-color: var(--hover-bg);
        }

        /* Main Wrapper */
        .main-wrapper {
            max-width: 680px;
            width: 100%;
            display: flex;
            position: relative;
        }

        .dashboard-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-left: 36px;
        }

        .category-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Klickbare Überschriften */
        .category-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--section-color);
            letter-spacing: 0.5px;
            margin: 0;
            padding-left: 4px;
            border-bottom: 1px solid var(--tile-border);
            padding-bottom: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .category-title.has-arrow::after {
            content: "›";
            font-size: 18px;
            font-weight: 400;
            line-height: 1;
            transition: transform 0.15s ease;
        }

        .category-title.is-back::after {
            content: "‹";
            font-size: 18px;
            font-weight: 400;
            line-height: 1;
            transition: transform 0.15s ease;
        }

        .category-title:hover {
            color: var(--text-color);
        }

        .category-title:hover.has-arrow::after {
            transform: translateX(3px);
        }

        .category-title:hover.is-back::after {
            transform: translateX(-3px);
        }

        /* Grid View */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            justify-items: center;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.15s ease;
            width: 100%;
        }

        .app-item:active {
            transform: scale(0.92); 
        }

        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 8px;
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            border: 1px solid var(--tile-border);
            position: relative;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-icon span.placeholder {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-color);
        }

        .app-name {
            font-size: 13px;
            font-weight: 400;
            text-align: center;
            color: var(--name-color);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* List View Styles */
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .app-list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-color);
            background-color: transparent;
            border: none;
            padding: 8px 4px;
            border-radius: 8px;
            transition: background 0.15s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .app-list-item:active, .app-list-item:hover {
            background-color: var(--hover-bg);
        }

        .app-list-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--tile-bg);
            border: 1px solid var(--tile-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-list-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-list-name {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-color);
        }

        /* A-Z Index Sidebar */
        .az-sidebar {
            position: absolute;
            left: -22px;
            top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 200;
            user-select: none;
        }

        .az-sidebar a {
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.1s;
        }

        .az-sidebar a.active-letter {
            color: var(--text-color);
            cursor: pointer;
        }

        .az-sidebar a.inactive-letter {
            color: var(--section-color);
            opacity: 0.25;
            pointer-events: none;
        }

        .az-sidebar a.active-letter:hover, .az-sidebar a.selected-letter {
            background-color: var(--hover-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-logo">
            <div class="brand-icon">
                <img src="icons/hedgehog.png" alt="Igel">
            </div>
        </div>

        <div class="bar-divider"></div>

        <button class="bar-icon-btn" title="Suchen" onclick="triggerNativeSearch()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <input type="text" id="searchInput" oninput="handleSearch()" autocomplete="off">

        <div class="bar-divider"></div>

        <!-- Ansicht Umschalten Button -->
        <button class="bar-icon-btn" title="Ansicht umschalten" onclick="toggleView()" id="viewToggleBtn">
            <svg id="viewIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>

        <div class="bar-divider"></div>

        <div class="nav-arrows" style="display: flex; gap: 2px;">
            <button class="bar-icon-btn" onclick="navigateCategory(-1)" title="Vorherige Kategorie / Zurück">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="bar-icon-btn" onclick="navigateCategory(1)" title="Nächste Kategorie">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>

        <div class="bar-divider"></div>

        <div class="tabs-container" id="tabs-container">
            <button class="tab-btn active" onclick="filterCategory('all', this)">Alle</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="az-sidebar" id="azSidebar" style="display: none;"></div>
        <div class="dashboard-container" id="dashboard"></div>
    </div>

    <script>
        const categories = [
            {
                id: "streaming",
                title: "Streaming & TV",
                shortTitle: "Streaming",
                apps: [
                    { name: "Apple TV", url: "https://www.youtube.com/redirect?q=https://tv.apple.com/de", image: "icons/appletv.png" },
                    { name: "ARD Mediathek", url: "https://www.youtube.com/redirect?q=https://www.ardmediathek.de", image: "icons/ard.png" },
                    { name: "DAZN", url: "https://www.youtube.com/redirect?q=https://www.dazn.com/de-DE", image: "icons/dazn.png" },
                    { name: "Disney+", url: "https://www.youtube.com/redirect?q=https://www.disneyplus.com/de-de", image: "icons/disneyplus.png" },
                    { name: "HBO Max", url: "https://www.youtube.com/redirect?q=https://www.hbomax.com/de/de", image: "icons/hbomax.png" },
                    { name: "Joyn", url: "https://www.youtube.com/redirect?q=https://www.joyn.de", image: "icons/joyn.png" },
                    { name: "MagentaTV", url: "https://www.youtube.com/redirect?q=https://www.magenta.tv", image: "icons/magentatv.png" },
                    { name: "Netflix", url: "https://www.youtube.com/redirect?q=https://www.netflix.com", image: "icons/netflix.png" },
                    { name: "Paramount+", url: "https://www.youtube.com/redirect?q=https://www.paramountplus.com", image: "icons/paramountplus.png" },
                    { name: "Prime Video", url: "https://www.youtube.com/redirect?q=https://www.amazon.de/primevideo", image: "icons/amazonprime.png" },
                    { name: "RTL+", url: "https://www.youtube.com/redirect?q=https://plus.rtl.de", image: "icons/rtlplus.png" },
                    { name: "TikTok", url: "https://www.youtube.com/redirect?q=https://www.tiktok.com", image: "icons/tiktok.png" },
                    { name: "Twitch", url: "https://www.youtube.com/redirect?q=https://www.twitch.tv", image: "icons/twitch.png" },
                    { name: "Waipu.TV", url: "https://www.youtube.com/redirect?q=https://app.waipu.tv/tv", image: "icons/waiputv.png" },
                    { name: "WOW", url: "https://www.youtube.com/redirect?q=https://www.wowtv.de", image: "icons/wow.png" },
                    { name: "YouTube", url: "https://www.youtube.com/redirect?q=https://www.youtube.com", image: "icons/youtube.png" },
                    { name: "ZDFmediathek", url: "https://www.youtube.com/redirect?q=https://www.zdf.de", image: "icons/zdf.png" }
                ]
            },
            {
                id: "musik",
                title: "Musik & Audio",
                shortTitle: "Musik",
                apps: [
                    { name: "Apple Music", url: "https://www.youtube.com/redirect?q=https://music.apple.com/de", image: "icons/applemusic.png" },
                    { name: "Spotify", url: "https://www.youtube.com/redirect?q=https://open.spotify.com", image: "icons/spotify.png" },
                    { name: "YouTube Music", url: "https://www.youtube.com/redirect?q=https://music.youtube.com/?persist_app=1", image: "icons/youtubemusic.png" }
                ]
            },
            {
                id: "navigation",
                title: "Navigation & Auto",
                shortTitle: "Navigation",
                apps: [
                    { name: "ABRP", url: "https://www.youtube.com/redirect?q=https://abetterrouteplanner.com", image: "icons/abrp.png" },
                    { name: "Google Maps", url: "https://www.youtube.com/redirect?q=https://www.google.com/maps", image: "icons/googlemaps.png" },
                    { name: "Tesla Charger Map", url: "https://www.youtube.com/redirect?q=https://www.tesla.com/de_de/findus", image: "icons/tesla.png" }
                ]
            },
            {
                id: "gaming",
                title: "Gaming",
                shortTitle: "Gaming",
                apps: [
                    { name: "GeForce NOW", url: "https://www.youtube.com/redirect?q=https://play.geforcenow.com", image: "icons/geforcenow.png" },
                    { name: "Xbox", url: "https://www.youtube.com/redirect?q=https://www.xbox.com/play", image: "icons/xbox.png" }
                ]
            },
            {
                id: "tools",
                title: "Tools & Web",
                shortTitle: "Tools",
                apps: [
                    { name: "ChatGPT", url: "https://www.youtube.com/redirect?q=https://chatgpt.com", image: "icons/chatgpt.png" },
                    { name: "Gemini", url: "https://www.youtube.com/redirect?q=https://gemini.google.com/app", image: "icons/gemini.png" },
                    { name: "Gmail", url: "https://www.youtube.com/redirect?q=https://mail.google.com", image: "icons/gmail.png" },
                    { name: "Google", url: "https://www.youtube.com/redirect?q=https://www.google.com", image: "icons/google.png" },
                    { name: "iCloud", url: "https://www.youtube.com/redirect?q=https://www.icloud.com", image: "icons/icloud.png" },
                    { name: "Outlook", url: "https://www.youtube.com/redirect?q=https://outlook.live.com", image: "icons/outlook.png" },
                    { name: "WhatsApp", url: "https://www.youtube.com/redirect?q=https://web.whatsapp.com", image: "icons/whatsapp.png" }
                ]
            }
        ];

        let currentView = 'grid'; // 'grid' or 'list'
        let activeCategory = 'all';
        let selectedLetter = null;
        let searchQuery = '';
        let categoryIds = ['all', ...categories.map(c => c.id)];

        const tabsContainer = document.getElementById('tabs-container');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.innerText = cat.shortTitle;
            btn.onclick = (e) => filterCategory(cat.id, btn);
            tabsContainer.appendChild(btn);
        });

        function openApp(url) {
            window.open(url, '_blank');
        }

        function updateViewIcon() {
            const iconSvg = document.getElementById('viewIcon');
            if (currentView === 'grid') {
                iconSvg.innerHTML = `<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>`;
            } else {
                iconSvg.innerHTML = `<path d="M3 12h18M3 6h18M3 18h18"/>`;
            }
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard');
            const azSidebar = document.getElementById('azSidebar');
            container.innerHTML = '';
            updateViewIcon();

            if (currentView === 'list' && activeCategory === 'all') {
                azSidebar.style.display = 'flex';
                
                let allApps = [];
                let availableLetters = new Set();

                categories.forEach(cat => {
                    cat.apps.forEach(app => {
                        let firstLetter = app.name.trim()[0].toUpperCase();
                        availableLetters.add(firstLetter);

                        let matchesSearch = app.name.toLowerCase().startsWith(searchQuery.toLowerCase());
                        let matchesLetter = selectedLetter ? (firstLetter === selectedLetter) : true;
                        
                        if (matchesSearch && matchesLetter) {
                            allApps.push(app);
                        }
                    });
                });
                allApps.sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));

                azSidebar.innerHTML = '';
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
                    if (availableLetters.has(letter)) {
                        let activeClass = (selectedLetter === letter) ? 'active-letter selected-letter' : 'active-letter';
                        azSidebar.innerHTML += `<a onclick="filterByLetter('${letter}')" class="${activeClass}">${letter}</a>`;
                    } else {
                        azSidebar.innerHTML += `<a class="inactive-letter">${letter}</a>`;
                    }
                });

                if (selectedLetter && allApps.length > 0) {
                    let sectionHTML = `
                        <div class="category-section">
                            <h2 class="category-title is-back" onclick="filterByLetter(null)" title="Zurück zur Übersicht">${selectedLetter}</h2>
                            <div class="app-list">
                    `;
                    allApps.forEach(app => {
                        let iconContent = app.image 
                            ? `<img src="${app.image}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="placeholder" style="display:none; font-size:16px;">${app.name[0]}</span>` 
                            : `<span class="placeholder" style="font-size:16px;">${app.name[0]}</span>`;

                        sectionHTML += `
                            <div class="app-list-item" onclick="openApp('${app.url}')">
                                <div class="app-list-icon">${iconContent}</div>
                                <span class="app-list-name">${app.name}</span>
                            </div>
                        `;
                    });
                    sectionHTML += `</div></div>`;
                    container.innerHTML += sectionHTML;
                } else {
                    let grouped = {};
                    allApps.forEach(app => {
                        let firstLetter = app.name.trim()[0].toUpperCase();
                        if (!grouped[firstLetter]) grouped[firstLetter] = [];
                        grouped[firstLetter].push(app);
                    });

                    Object.keys(grouped).sort().forEach(letter => {
                        let sectionHTML = `
                            <div class="category-section">
                                <h2 class="category-title has-arrow" onclick="filterByLetter('${letter}')" title="Nur diesen Buchstaben anzeigen">${letter}</h2>
                                <div class="app-list">
                        `;
                        grouped[letter].forEach(app => {
                            let iconContent = app.image 
                                ? `<img src="${app.image}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="placeholder" style="display:none; font-size:16px;">${app.name[0]}</span>` 
                                : `<span class="placeholder" style="font-size:16px;">${app.name[0]}</span>`;

                            sectionHTML += `
                                <div class="app-list-item" onclick="openApp('${app.url}')">
                                    <div class="app-list-icon">${iconContent}</div>
                                    <span class="app-list-name">${app.name}</span>
                                </div>
                            `;
                        });
                        sectionHTML += `</div></div>`;
                        container.innerHTML += sectionHTML;
                    });
                }

            } else {
                azSidebar.style.display = 'none';

                categories.forEach(category => {
                    if (activeCategory !== 'all' && activeCategory !== category.id) return;

                    const filteredApps = category.apps
                        .filter(app => {
                            let firstLetter = app.name.trim()[0].toUpperCase();
                            let matchesSearch = app.name.toLowerCase().startsWith(searchQuery.toLowerCase());
                            let matchesLetter = selectedLetter ? (firstLetter === selectedLetter) : true;
                            return matchesSearch && matchesLetter;
                        })
                        .sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));

                    if (filteredApps.length === 0) return;

                    let titleClass = (activeCategory !== 'all') ? "category-title is-back" : "category-title has-arrow";
                    let titleAction = (activeCategory !== 'all') ? "filterCategory('all', document.querySelector('.tab-btn'))" : `selectCategoryByTitle('${category.id}')`;
                    let titleTooltip = (activeCategory !== 'all') ? "Zurück zu Alle" : "Vollansicht öffnen";

                    let sectionHTML = `
                        <div class="category-section is-category">
                            <h2 class="${titleClass}" onclick="${titleAction}" title="${titleTooltip}">${category.title}</h2>
                    `;

                    if (currentView === 'grid') {
                        sectionHTML += `<div class="app-grid">`;
                        filteredApps.forEach(app => {
                            let iconContent = app.image 
                                ? `<img src="${app.image}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="placeholder" style="display:none;">${app.name[0]}</span>` 
                                : `<span class="placeholder">${app.name[0]}</span>`;

                            sectionHTML += `
                                <div class="app-item" onclick="openApp('${app.url}')">
                                    <div class="app-icon">${iconContent}</div>
                                    <span class="app-name">${app.name}</span>
                                </div>
                            `;
                        });
                        sectionHTML += `</div>`;
                    } else {
                        sectionHTML += `<div class="app-list">`;
                        filteredApps.forEach(app => {
                            let iconContent = app.image 
                                ? `<img src="${app.image}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="placeholder" style="display:none; font-size:16px;">${app.name[0]}</span>` 
                                : `<span class="placeholder" style="font-size:16px;">${app.name[0]}</span>`;

                            sectionHTML += `
                                <div class="app-list-item" onclick="openApp('${app.url}')">
                                    <div class="app-list-icon">${iconContent}</div>
                                    <span class="app-list-name">${app.name}</span>
                                </div>
                            `;
                        });
                        sectionHTML += `</div>`;
                    }

                    sectionHTML += `</div>`;
                    container.innerHTML += sectionHTML;
                });
            }
        }

        function toggleView() {
            currentView = currentView === 'grid' ? 'list' : 'grid';
            selectedLetter = null;
            renderDashboard();
        }

        function triggerNativeSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.focus();
        }

        function filterCategory(catId, btnElement) {
            activeCategory = catId;
            selectedLetter = null;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            } else {
                let catIndex = categoryIds.indexOf(catId);
                let buttons = document.querySelectorAll('.tab-btn');
                if (buttons[catIndex]) buttons[catIndex].classList.add('active');
            }
            renderDashboard();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategoryByTitle(catId) {
            let catIndex = categoryIds.indexOf(catId);
            if (catIndex !== -1) {
                let buttons = document.querySelectorAll('.tab-btn');
                let targetButton = buttons[catIndex];
                filterCategory(catId, targetButton);
            }
        }

        function filterByLetter(letter) {
            selectedLetter = (selectedLetter === letter) ? null : letter;
            renderDashboard();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateCategory(direction) {
            if (selectedLetter !== null) {
                selectedLetter = null;
                renderDashboard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            if (activeCategory !== 'all') {
                filterCategory('all', document.querySelector('.tabs-container button'));
                return;
            }

            let currentIndex = categoryIds.indexOf(activeCategory);
            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = categoryIds.length - 1;
            if (newIndex >= categoryIds.length) newIndex = 0;
            
            let newCatId = categoryIds[newIndex];
            let buttons = document.querySelectorAll('.tab-btn');
            let targetButton = buttons[newIndex];
            
            filterCategory(newCatId, targetButton);
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderDashboard();
        }

        renderDashboard();
    </script>
</body>
</html>
